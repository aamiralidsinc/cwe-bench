schema_version = "1.1"

[task]
name = "cwe-bench/offline-check"
description = "Wiring check: the agent phase reaches only the model APIs (CWE-bench offline setting); not a benchmark task."
authors = [{ name = "mason-skillmaker" }]

[verifier]
environment_mode = "shared"
timeout_sec = 300.0

[agent]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
