# divq settings (diversity experiment). Every version divq loads is recorded in the DB (table settings);
# every job records the version it was dispatched under. Edit, commit, and the loops pick the change up at
# their next tick; running jobs keep the version they started with.

[paths]
# relative to diversity_population/
db = "out/divq.db"
releases = "out/releases"
results = "out/results"
chunks = "out/chunks"
# the encryption passphrase for payloads and artifacts (never committed, never printed)
key_file = "~/.tb-graders/cwe/diversity/payload.key"
# the file holding the account tokens (read by variable name, values never printed)
env_file = "~/terminal-bench/.env"

[dispatch]
enabled = true
tick_sec = 60
# which chunks may be dispatched, in order; chunk N's priority is (len - index) * chunk_priority_step
chunks = [1]
chunk_priority_step = 100
aging_per_hour = 1
# spacing between two dispatches on the same account (seconds)
spacing_sec = 10
# local disk floor of the machine that receives the artifacts (GB); no dispatch below it
local_disk_floor_gb = 30
# download attempts per artifact, and the wait between them (seconds, multiplied by the attempt)
fetch_attempts = 5
fetch_backoff_sec = 15
# artifact retention passed to the workflow (days); an event fires at warn_days if not fetched
artifact_retention_days = 7
artifact_warn_days = 5

[limits]
# runs per job kind across all accounts
max_running.build = 60
max_running.trial_run = 120
# attempts before a job is blocked (a person looks)
max_attempts.build = 2
max_attempts.trial_run = 3
# a run that ends without a usable result counts as an attempt

[runner]
# what a standard GitHub-hosted runner gives a job (public repos): tasks asking for more are not dispatched
cpus = 4
memory_mb = 16000
build_timeout_sec = 14400        # builder limit on runners: 4 h, inside the 6 h job limit
job_timeout_min = 355

[adaptive]
# per-account runner slots, learned from what GitHub actually grants
initial = 5
min = 1
max = 20
# a run waiting longer than this for a runner means the account is at capacity: limit := running count
queued_wait_min = 8
# no run waited longer than raise_wait_min during raise_window_min, and work was waiting: limit += 1
raise_wait_min = 3
raise_window_min = 30
cooldown_min = 30

[trial]
models = ["deepseek", "mimo"]
runs = 3
agent_timeout_mult = 1.5

# Accounts: owner decision pending (diversity_population/actions/README.md section 7). None is enabled.
# token_var names a variable in env_file; repo is created by `divq repo sync`.
[[accounts]]
name = "marahassan8"
token_var = "MARA_HASSAN8_GH"
repo = "marahassan8/divq-runs"
enabled = false

