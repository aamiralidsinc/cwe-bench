# harbor-canary GUID GENERATE-PER-TASK
# Builder: replace GENERATE-PER-TASK with one fresh uuid4; use the SAME GUID at the top of
# environment/Dockerfile, tests/Dockerfile and tests/test.sh.
schema_version = "1.4"

# Separate-mode grading (B1): Harbor collects the agent's /workspace after the agent phase and
# restores it at the same path in the verifier container; nothing else crosses over. Exclude build
# outputs and dependency caches (the verifier rebuilds). Add this project's build dirs to `exclude`.
artifacts = [{ source = "/workspace", exclude = [".git", "node_modules", "__pycache__", ".cache", "target", "dist", "build", "*.class"] }]

[task]
name = "cwe-bench/SLUG"
description = ""             # one sentence, impact in plain terms (no fix hints)
keywords = []               # a few short topic words
authors = [{ name = "Mara Hassan" }]

[metadata]
# --- our own fields (never shown to the agent) ---
cwe_id = "CWE-000"
language = ""
repo = "https://github.com/OWNER/REPO"
source = "mined"            # mined | mined+injected | injected
entry_point = ""            # e.g. "HTTP POST /api/login", "library API: pkg.func"
advisory = ""               # GHSA / CVE id; never appears in instruction.md
vulnerable_commit = ""
fix_commit = ""
category = "Security"
tags = []
# --- template delivery fields (B7) ---
author_name = "Mara Hassan"
author_email = "mara.hassann@gmail.com"
difficulty = "hard"
difficulty_explanation = ""  # why a fair expert still needs real effort (no fix hints)
solution_explanation = ""    # how the reference fix in solution/ closes every route
verification_explanation = "An offline, separate-container verifier restores the agent's /workspace, rebuilds it as an unprivileged user (uid 1000), and runs hidden security and functional suites with the project's native runner as that user; grading is orchestrated as root but no submission code runs as root. Primary reward is 1.0 only when every security and functional test passes (0 if any functional test fails, otherwise the capped security fraction); metrics.json also records the template's passed/total ratio and the raw counts."

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 1800.0         # must exceed BUILD_TIMEOUT + SUITE_TIMEOUT in tests/test.sh (raise for heavy builds, e.g. Maven)

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
workdir = "/workspace"

[agent]
timeout_sec = 7200.0         # 2-hour security-fix budget (not the template's 8h)
user = "agent"
# Offline (B4). No model allowlist in the task file; the evaluator allows its model host at run time:
#   --allow-agent-host=api.deepseek.com   (set in harness/run_trial.sh)
network_mode = "no-network"

[environment]
network_mode = "public"      # only while the image builds / the agent runtime installs
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
workdir = "/workspace"

[verifier.env]
[solution.env]
