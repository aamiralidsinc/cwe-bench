schema_version = "1.1"

[task]
name = "cwe-bench/SLUG"
description = ""
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-000"
language = ""
repo = "https://github.com/OWNER/REPO"
source = "mined"            # mined | mined+injected | injected
entry_point = ""            # e.g. "HTTP POST /api/login", "CLI: tool --flag", "library API: pkg.func"
advisory = ""               # GHSA / CVE id; never appears in instruction.md
vulnerable_commit = ""
fix_commit = ""
category = "Security"
tags = []

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
