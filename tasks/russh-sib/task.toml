schema_version = "1.1"

[task]
name = "cwe-bench/russh-sib"
description = "Fix an SSH transport flaw where algorithm agreement accepts null/insecure choices (null key exchange, null cipher, or a MAC-requiring cipher with the null MAC) and brings up a session with no confidentiality, integrity or server authentication."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-129"
language = "Rust"
repo = "https://github.com/eugeny/russh"
source = "mined+injected"
entry_point = "library API: russh server::run_stream / client::connect(_stream) SSH transport handshake (algorithm negotiation)"
advisory = "GHSA-p8qx-h547-fjw9"
vulnerable_commit = "3430fd26ecafc0dc3705210f5f39a9119fa22774"
fix_commit = "2885385abfee279092a41d80c6cb6ac367353159"
category = "Security"
tags = ["ssh", "negotiation", "integrity", "mac", "cipher", "kex", "downgrade"]

[verifier]
environment_mode = "shared"
timeout_sec = 1500.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 6144
storage_mb = 20480
