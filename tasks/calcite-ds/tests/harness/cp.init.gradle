gradle.projectsEvaluated {
    def p = gradle.rootProject.findProject(':core')
    if (p != null && p.tasks.findByName('writeHiddenTestCp') == null) {
        p.tasks.register('writeHiddenTestCp') {
            // Main classes plus the external test-scope jars (HSQLDB, logging) the hidden
            // suites use; the project's own test classes are not needed here.
            def cp = p.sourceSets.main.runtimeClasspath + p.configurations.testRuntimeClasspath
            dependsOn cp
            doLast {
                new File(System.getProperty('hidden.cp.file', '/tmp/ht/cp.txt')).text = cp.asPath
            }
        }
    }
}
