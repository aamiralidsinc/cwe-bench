schema_version = "1.1"

[task]
name = "cwe-bench/summarize-ds"
description = "SSRF through feed- and page-derived URL fetching in the summarize library, CLI and daemon"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-918"
language = "TypeScript"
repo = "https://github.com/steipete/summarize"
source = "injected"          # mined+injected: published fix sites plus sibling fetch sites added in our copy
entry_point = "library API createLinkPreviewClient().fetchLinkContent, CLI, and daemon POST /v1/summarize URL mode"
advisory = "GHSA-3VX2-VQX8-JXFG / CVE-2026-53782"
vulnerable_commit = "cd3ee48fb24a54aa3a7653ffd84ae38616227377"
fix_commit = "3c5522440c4833dde033e226baa39e6dda1dfc75"
category = "Security"
tags = ["ssrf", "dns", "typescript", "podcast"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
