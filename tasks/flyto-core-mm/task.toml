schema_version = "1.1"

[task]
name = "cwe-bench/flyto-core-mm"
description = "Workflow modules write caller-chosen and data-derived output files outside the operator sandbox directory"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "python"
repo = "https://github.com/flytohub/flyto-core"
source = "mined+injected"    # mined | mined+injected | injected
entry_point = "HTTP POST /v1/execute (module execution API)"
advisory = "GHSA-2956-977X-2W3R / CVE-2026-67429 / PYSEC-2026-3568"
vulnerable_commit = "9103529c204cad3e698b726ed958b626bcfbc182"
fix_commit = "d5f89d71303e3c1e6418d347c5c55fcd173cc8cc"
category = "Security"
tags = ["path-traversal", "arbitrary-file-write", "CWE-73", "pattern-A+B"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
