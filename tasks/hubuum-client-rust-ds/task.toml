schema_version = "1.1"

[task]
name = "cwe-bench/hubuum-client-rust-ds"
description = "Keep server-provided and caller-secret content out of the Rust client's default diagnostics while preserving explicit accessors."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-532"
language = "Rust"
repo = "https://github.com/hubuum/hubuum-client-rust"
source = "injected"         # real base flaw + same-class siblings injected into our copy (see build notes)
entry_point = "Rust library API: typed/raw calls and high-level run operations on the async and blocking clients (errors and returned result values)"
advisory = "GHSA-2625-RW7M-5Q5X"
vulnerable_commit = "9c123207eb141ef1cfc8f53af538a06eeb458461"
fix_commit = "5a5c275ffa45f342459b7d3e977926da643bde50"
category = "Security"
tags = ["information-exposure", "diagnostics", "redaction", "multi-client"]

[verifier]
environment_mode = "shared"
timeout_sec = 1200.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
