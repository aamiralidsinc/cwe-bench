schema_version = "1.1"

[task]
name = "cwe-bench/jenkins-ec2fleet-authz-inj"
description = "Fix missing permission and request-method enforcement (and caller-chosen AWS region/endpoint validation) on a Jenkins cloud plugin's configuration-form web methods."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862"
language = "Java"
repo = "https://github.com/jenkinsci/ec2-fleet-plugin"
source = "mined+injected"
entry_point = "HTTP GET/POST to the plugin's Stapler form/web methods (cloud configuration endpoints under descriptorByName/... and the plugin root action)"
advisory = "GHSA-2X9C-VP3G-HVV2"
vulnerable_commit = "8fedff2a81c3f91c14e7a1f5ea5191063f3d43b3"
fix_commit = "a6eedb7bc112de92bbba179c03840d845b845c82"
category = "Security"
tags = ["jenkins", "csrf", "authorization", "ssrf", "aws"]

[verifier]
environment_mode = "shared"
timeout_sec = 1800.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 6144
storage_mb = 20480
