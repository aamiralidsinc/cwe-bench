schema_version = "1.1"

[task]
name = "cwe-bench/grav-mm"
description = "Fix a configuration-exfiltration flaw in a flat-file CMS's sandboxed page-content templating."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-200"
language = "PHP"
repo = "https://github.com/getgrav/grav"
source = "injected"
entry_point = "Sandboxed editor page-content Twig rendered through the application's Twig sandbox policy"
advisory = "GHSA-MC5Q-6HPJ-RP7J / CVE-2026-61450 / CVE-2026-61842"
vulnerable_commit = "734f7f4c266693a486198047c10f79d3e175e90c"
fix_commit = "7efe70574e4cf01a251318478c13673029e93eb6"
category = "Security"
tags = ["php", "twig", "sandbox", "information-exposure", "injected-siblings"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
