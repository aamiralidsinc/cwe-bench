schema_version = "1.1"

[task]
name = "cwe-bench/filament-inv"
description = "Harden the authentication and multi-factor flows of a Laravel admin-panel framework against several co-present weaknesses."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862,CWE-204,CWE-294,CWE-306"
language = "PHP"
repo = "https://github.com/filamentphp/filament"
source = "mined+stacking"
entry_point = "HTTP/Livewire: panel login component (authenticate, _startUpload/_finishUpload), the multi-factor challenge form, and the profile security 'disable app authentication' action"
advisory = "GHSA-44wp-g8f4-f4v5 / GHSA-xwpv-pqxp-5v36 / GHSA-r3j6-gpjw-qfjr / GHSA-7m6h-rg42-m449"
vulnerable_commit = "e1f36a7316d75476f3301e044cc360d7cb746c56"
fix_commit = "f7500b1b1932150066a1d4d2be857157962536b2"
category = "Security"
tags = ["authentication", "authorization", "multi-factor", "laravel", "livewire", "php", "stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
