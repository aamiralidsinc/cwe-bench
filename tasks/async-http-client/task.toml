schema_version = "1.1"

[task]
name = "cwe-bench/async-http-client"
description = "Fix a cookie-handling authentication flaw in an async HTTP client library."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-287"
language = "Java"
repo = "https://github.com/asynchttpclient/async-http-client"
source = "mined"
entry_point = "library API: AsyncHttpClient request built with a Cookie header against a client whose cookie store holds a cookie for the origin"
advisory = "GHSA-2jwh-9rmr-j4xf"
vulnerable_commit = "7dc5bbc2d0a48aa2a9caf089a626dcfd333168e9"
fix_commit = "fd9763620725126c1c8bb0af1ceb9a7523099a5f"
category = "Security"
tags = ["java", "http-client", "cookies", "authentication", "session"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
