[package]
name = "tz-hidden"
version = "0.1.0"
edition = "2021"

[dependencies]
tensorzero-core = { path = "../../crates/tensorzero-core", features = ["e2e_tests"] }
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8", features = ["macros", "http2"] }
tower = { version = "0.5", features = ["util"] }
http = "1.4.0"
serde_json = "1.0.143"
object_store = { version = "0.13.2", features = ["serde", "aws", "gcp"] }
tempfile = "3.27.0"
base64 = "0.22"
tokio-util = { version = "0.7.17", features = ["rt", "time"] }
uuid = "1.22.0"
blake3 = "1.8.5"
async-trait = "0.1.89"
url = "2.5.8"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "functional"
path = "tests/functional.rs"
