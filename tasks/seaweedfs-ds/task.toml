schema_version = "1.1"

[task]
name = "cwe-bench/seaweedfs-ds"
description = "SeaweedFS S3 Tables API and Iceberg REST catalog: table storage authorization is not scoped to the caller"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-863"
language = "Go"
repo = "https://github.com/seaweedfs/seaweedfs"
source = "mined+injected"
entry_point = "HTTP: S3 Tables API (POST / with X-Amz-Target) on the S3 gateway, and the Iceberg REST catalog routes"
advisory = "GHSA-HGPF-8634-G44C"
vulnerable_commit = "b56d155b315777dab97caea4380528ace087b529"
fix_commit = "b13463880c1fa62e255c058a9228b63cc95b4b36"
category = "Security"
tags = ["cwe-863", "authorization", "s3tables", "iceberg", "go"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
