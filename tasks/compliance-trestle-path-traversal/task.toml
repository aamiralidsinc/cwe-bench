schema_version = "1.1"

[task]
name = "cwe-bench/compliance-trestle-path-traversal"
description = "Fix path traversal in a compliance-as-code CLI: user-chosen output, task and model names write or delete files outside the workspace."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Python"
repo = "https://github.com/oscal-compass/compliance-trestle"
source = "mined"            # mined | mined+injected | injected
entry_point = "CLI: trestle author catalog-generate -n <catalog> -o <output> (and the other trestle commands taking output, task or model names)"
advisory = "GHSA-r4vp-3vw6-r2x5 / CVE-2026-57171 / PYSEC-2026-4030"
vulnerable_commit = "0f82d19bd42f9cc0f1b3acd7fc3f6dafe3b6ae10"
fix_commit = "37ed44f5f2e074202c8eb7c2f203c05d19461cdc"
category = "Security"
tags = ["path-traversal", "cli", "arbitrary-file-write", "python"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
