schema_version = "1.1"

[task]
name = "cwe-bench/docling-file-disclosure"
description = "Fix local file disclosure in a document-conversion SDK: image references inside serialized documents make docling embed or copy files from the host."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-73"
language = "Python"
repo = "https://github.com/docling-project/docling"
source = "mined"            # mined | mined+injected | injected
entry_point = "library API: DocumentConverter().convert(<docling .json>) then an embedded/referenced export (also ConversionAssets.load and DoclingServiceClient results)"
advisory = "GHSA-p944-4xh2-x776 / CVE-2026-105748"
vulnerable_commit = "e4780063bb4c33b2b48222d2106ce9ba45eaf453"
fix_commit = "d4bb776884aba9aa3132f54773f420853cf7afe4"
category = "Security"
tags = ["file-disclosure", "external-file-reference", "deserialization", "python", "sdk"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
