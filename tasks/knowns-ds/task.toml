schema_version = "1.1"

[task]
name = "cwe-bench/knowns-ds"
description = "Keep caller-supplied and stored identifiers from mapping to files outside the project's managed document, memory and template roots"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Go"
repo = "https://github.com/knowns-dev/knowns"
source = "injected"
entry_point = "MCP tools (docs, memory, templates) and the local web API (documents, memories, templates)"
advisory = "GHSA-9GFJ-28HW-JCHP"
vulnerable_commit = "d3989829fb5095666d23d005b2f78a082832a396"
fix_commit = "09c5a96fd5817b941dc86669278c1a17db10ed4e"
category = "Security"
tags = ["path-traversal", "arbitrary-file-read", "arbitrary-file-write", "mcp", "symlink"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
