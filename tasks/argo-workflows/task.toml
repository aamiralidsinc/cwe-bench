schema_version = "1.1"

[task]
name = "cwe-bench/argo-workflows"
description = "Fix several co-present vulnerabilities in a Kubernetes-native workflow engine's API server and workflow-execution path: missing access-control checks on template and sync-limit API calls, credential exposure in artifact logs, an unauthenticated resource-exhaustion vector, and a template-referencing security bypass."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862,CWE-863,CWE-200,CWE-522,CWE-770"
language = "Go"
repo = "https://github.com/argoproj/argo-workflows"
source = "mined+stacking"
entry_point = "Go: argo-server gRPC/HTTP service handlers (WorkflowTemplate/ClusterWorkflowTemplate read, sync-limit CRUD, webhook event interceptor) exercised as a client against an in-memory Kubernetes fake client; the artifact-driver library wrapper; and the controller's workflow-operation entrypoint"
advisory = "GHSA-56px-hm34-xqj5,GHSA-xchc-cqwg-g76q,GHSA-7vf8-2cr6-54mf,GHSA-jcc8-g2q4-9fxq,GHSA-3775-99mw-8rp4"
vulnerable_commit = "4cac12c75de720889ad2cae8a6cc63c566b1d8d8"
fix_commit = "32afec3c401c0920517bf1e890fa7dba6170cdf2,09fff05e0830c14a5e36cc40597ad84881db1ab6,bdd40908580f727c590c8743836e338b04fe4a87,7abb4de6c3599e2d5d960ba4d5de4cf1df109965,2727f3f701677d467dfb5e053c57237cbc752c3c"
category = "Security"
tags = ["go", "kubernetes", "access-control", "authorization", "information-disclosure", "credential-exposure", "dos", "stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 1800.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 2
memory_mb = 8192
storage_mb = 20480
