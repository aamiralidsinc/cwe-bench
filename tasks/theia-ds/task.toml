schema_version = "1.1"

[task]
name = "cwe-bench/theia-ds"
description = "Make Eclipse Theia's AI features honour workspace trust: execution gates, workspace-scope AI configuration, workspace content and provider setup must not influence AI in an untrusted workspace."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-829"
language = "TypeScript"
repo = "https://github.com/eclipse-theia/theia"
source = "injected"         # published advisory fix + real uncovered routes + injected siblings
entry_point = "library API: Theia frontend services (AI activation and command wrapper, LanguageModelService.sendRequest, AI preference readers, skill/template/provider loaders)"
advisory = "GHSA-3JWW-HXQJ-WFQ2 / CVE-2026-44688"
vulnerable_commit = "de745e95b4273fcb72358f0e34c5340beb359a74"
fix_commit = "e3fdfe6992389bc5fa611058d00c39d7408508ed"
category = "Security"
tags = ["workspace-trust", "restricted-mode", "ai", "prompt-injection", "typescript"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
