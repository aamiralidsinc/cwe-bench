schema_version = "1.1"

[task]
name = "cwe-bench/yamcs-ds"
description = "Fix missing authorization on Yamcs live subscription handlers and on the mission-database override readers that expose the same data."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862"
language = "Java"
repo = "https://github.com/yamcs/yamcs"
source = "mined+injected"
entry_point = "Yamcs websocket API live subscriptions (telemetry packets, containers, raw streams, mission-database changes, algorithm status, command history) and the REST mission-database override readers"
advisory = "GHSA-FWWW-CP23-7F5G"
vulnerable_commit = "b566beceba98cc35514b0e1519be126b8c5a0438"
fix_commit = "0691731846c5a0aca81b88fabbd2cd51d56fe076"
category = "Security"
tags = ["yamcs", "authorization", "websocket", "subscription", "telemetry"]

[verifier]
environment_mode = "shared"
timeout_sec = 2400.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 6144
storage_mb = 20480
