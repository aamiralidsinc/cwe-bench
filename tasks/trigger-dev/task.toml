schema_version = "1.1"

[task]
name = "cwe-bench/trigger-dev"
description = "Fix several co-present vulnerabilities in a self-hostable background-jobs platform's HTTP API (SSRF via alert webhooks, cross-environment deployment cancellation, an unauthenticated realtime-stream write, and an unauthenticated batch-completion action)."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-918,CWE-639,CWE-306,CWE-862"
language = "TypeScript"
repo = "https://github.com/triggerdotdev/trigger.dev"
source = "mined+stacking"
entry_point = "HTTP: requests to a running trigger.dev webapp — POST /api/v1/projects/<ref>/alertChannels, POST /api/v1/deployments and /api/v1/deployments/<id>/cancel, POST /realtime/v1/streams/<runId>/<streamId>, and the dashboard action POST /resources/batches/<batchId>/check-completion"
advisory = "GHSA-q567-cr4x-96w4,GHSA-xxv7-2vv3-h682,GHSA-4672-hwv6-gq62,GHSA-59h8-w5q6-mfmp,GHSA-pp95-gc86-jq6q"
vulnerable_commit = "bb450e608de2da1219af66a11d3a02c26a9f930b"
fix_commit = "34b1a181c2a1d33a53ebab88f84b05f81fea4254"
category = "Security"
tags = ["typescript", "node", "remix", "ssrf", "access-control", "authorization", "missing-authentication", "stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 2400.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 8192
storage_mb = 20480
