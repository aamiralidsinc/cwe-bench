schema_version = "1.1"

[task]
name = "cwe-bench/marshmallow-readonly-sib"
description = "Fix read-only / write-only field declarations that a serialization library silently drops in some schema compositions (mass assignment)."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-915"
language = "Python"
repo = "https://github.com/marshmallow-code/marshmallow"
source = "injected"         # no upstream advisory or fix: real, pre-existing gaps in unmodified upstream code (see build notes)
entry_point = "library API: Schema.load / Schema.dump with dump_only / load_only declarations on nested schemas"
advisory = "none (gaps found by us; no upstream advisory)"
vulnerable_commit = "d08471b17880c62b789971ada638707a11d3f8d4"   # dev HEAD 2026-10-06, version 4.3.1
fix_commit = "none (reference fix written by the builder)"
category = "Security"
tags = ["mass-assignment", "read-only-fields", "serialization", "python"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
