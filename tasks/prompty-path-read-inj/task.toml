schema_version = "1.1"

[task]
name = "cwe-bench/prompty-path-read-inj"
description = "Confine author-controlled file references in the prompt loader to the prompt directory."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Python"
repo = "https://github.com/microsoft/prompty"
source = "injected"         # real base flaw + same-class siblings injected into our copy (see build notes)
entry_point = "library API: prompty.load() / prompty.load_async()"
advisory = "GHSA-wxhm-2mq7-7697"   # CVE-2026-53598; never appears in instruction.md
vulnerable_commit = "90171a7738f9ff5a186416381cbfad9077cdf637"
fix_commit = "88ac9948d7d37995edbb2f6d36913436626c39e1"
category = "Security"
tags = ["path-traversal", "arbitrary-file-read", "prompt-loader"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
