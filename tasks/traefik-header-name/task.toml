schema_version = "1.1"

[task]
name = "cwe-bench/traefik-header-name"
description = "Stop clients of a reverse proxy from smuggling a spelling variant of a request header that the proxy sets or strips (for example the authenticated-user header) to backends that read '_' and '-' alike, and add an entry-point setting to keep, delete or reject headers with underscores, while keeping other headers forwarded as today."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-178,CWE-290,CWE-345"
language = "Go"
repo = "https://github.com/traefik/traefik"
source = "mined"            # mined | mined+injected | injected
entry_point = "HTTP requests through Traefik middlewares (basic, digest and forward authentication, custom request headers) and through an entry point created from static configuration flags, driven as in-process Go tests over loopback"
advisory = "GHSA-x677-9fxg-v5c5,CVE-2026-54763,GO-2026-6211"
vulnerable_commit = "0056f09a0c4aff3cdd789bcad44a6dd196884180"
fix_commit = "108a5264473a2cbc8f12d6d691a3c6553cdf2c1b"
category = "Security"
tags = ["go", "reverse-proxy", "header-spoofing", "authentication", "pattern-B"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 6144
storage_mb = 10240
