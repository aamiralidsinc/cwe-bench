schema_version = "1.1"

[task]
name = "cwe-bench/flowise-cross-tenant-inj"
description = "Fix a cross-tenant credential access flaw in a low-code LLM app builder's server."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-285"
language = "typescript"
repo = "https://github.com/flowiseai/flowise"
source = "injected"
entry_point = "HTTP GET /api/v1/openai-assistants-vector-store/:id?credential=<id>"
advisory = "GHSA-CHM3-VQCF-52RX"
vulnerable_commit = "700137738bcaebefd4709021f6d6b0abcd7df0ac"
fix_commit = "d81483b70c997ddf981acc9c49fbd9a02fa345cd"
category = "Security"
tags = ["access-control", "idor", "multi-tenant", "credentials"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
