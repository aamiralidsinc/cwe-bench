schema_version = "1.1"

[task]
name = "cwe-bench/jackson-databind-readonly"
description = "Fix a mass-assignment flaw: request input can change properties a JSON data-binding library is told are read-only."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-915"
language = "Java"
repo = "https://github.com/fasterxml/jackson-databind"
source = "injected"
entry_point = "library API: ObjectMapper.readerForUpdating(existing).readValue(json), ObjectMapper.readValue(json, T), ObjectMapper.updateValue(existing, input)"
advisory = ""
vulnerable_commit = "d627a8a86fcb062429282f79f3f256f181ed2c7b"
fix_commit = ""
category = "Security"
tags = ["deserialization", "mass-assignment", "read-only", "merge", "trap-stack"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
