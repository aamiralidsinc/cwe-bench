schema_version = "1.1"

[task]
name = "cwe-bench/jackson-databind-sib2"
description = "Fix an authorization/view-filtering bypass in a JSON data-binding library's deserialization paths."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-863"
language = "Java"
repo = "https://github.com/fasterxml/jackson-databind"
source = "mined+injected"
entry_point = "library API: ObjectMapper.readerWithView(View).forType(T).readValue(json)"
advisory = "GHSA-mhm7-754m-9p8w"
vulnerable_commit = "d627a8a86fcb062429282f79f3f256f181ed2c7b"
fix_commit = "c628b357ed143d8492756d5c1458cfb9fbeb29ed"
category = "Security"
tags = ["deserialization", "authorization", "json-view", "polymorphic", "trap-stack"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
