schema_version = "1.1"

[task]
name = "cwe-bench/seaweedfs-s3tables-authz"
description = "SeaweedFS S3 Tables / Iceberg catalog: table storage authorization is not scoped to the caller"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-863"
language = "Go"
repo = "https://github.com/seaweedfs/seaweedfs"
source = "mined"            # mined | mined+injected | injected
entry_point = "HTTP: S3 Tables API (POST / with X-Amz-Target S3Tables.*) and Iceberg REST catalog (/v1/{prefix}/namespaces...) of the S3 gateway; CLI: weed shell s3tables.bucket"
advisory = "GHSA-HGPF-8634-G44C / CVE-2026-55873 / GO-2026-6329"
vulnerable_commit = "b56d155b315777dab97caea4380528ace087b529"
fix_commit = "b13463880c1fa62e255c058a9228b63cc95b4b36"
category = "Security"
tags = ["authorization", "multi-tenant", "s3tables", "iceberg", "pattern-A+B"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
