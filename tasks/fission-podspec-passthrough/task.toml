schema_version = "1.1"

[task]
name = "cwe-bench/fission-podspec-passthrough"
description = "Stop tenant-written Environment and Function objects of a Kubernetes serverless framework from giving the pods the platform creates host namespaces, privileged containers, dangerous capabilities, node filesystem mounts or a tenant-chosen service account, while keeping ordinary pod customisation working."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-269,CWE-284,CWE-693"
language = "Go"
repo = "https://github.com/fission/fission"
source = "mined"            # mined | mined+injected | injected
entry_point = "Kubernetes admission (validating webhooks for fission.io/v1 Environment and Function, create and update, plus the Helm chart registration) and the controllers that build pods from stored objects (executor pool manager, container executor, builder manager), driven as Go tests with client-go fakes"
advisory = "GHSA-gx55-f84r-v3r7,CVE-2026-50564,GO-2026-5855"
vulnerable_commit = "8fa799417c77ce8a0189d9858bfe11ece29b84a6"
fix_commit = "e484df8460bb4e8026e24210120602aa7f181f64"
category = "Security"
tags = ["go", "kubernetes", "privilege-escalation", "admission", "pattern-A+B"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 6144
storage_mb = 10240
