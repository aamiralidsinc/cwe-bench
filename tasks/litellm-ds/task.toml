schema_version = "1.1"

[task]
name = "cwe-bench/litellm-ds"
description = "Stop proxy callers from choosing the outbound destination or redirecting configured credentials, across body, path and form inputs."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-918"
language = "Python"
repo = "https://github.com/berriai/litellm"
source = "injected"         # published request-parameter/destination fix (A) + real uncovered route (B) + injected siblings
entry_point = "HTTP proxy routes: deployment-scoped chat/completions, embeddings, images and moderations; /v1/files multipart; /health/test_connection; /queue/chat/completions"
advisory = "GHSA-3CV6-JPF6-8222"
vulnerable_commit = "76ffefcc1c36f4e78178ca0278d38385cafa6ec6"
fix_commit = "473f72e63a9777d793fbbf57194d8ec4fb97bc1b"
category = "Security"
tags = ["ssrf", "credential-exfiltration", "destination-routing", "proxy"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
