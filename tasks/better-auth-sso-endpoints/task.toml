schema_version = "1.1"

[task]
name = "cwe-bench/better-auth-sso-endpoints"
description = "Fix a server-side request forgery via unvalidated OIDC provider endpoint URLs saved at SSO provider registration in an authentication library."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-918"
language = "TypeScript"
repo = "https://github.com/better-auth/better-auth"
source = "mined"
entry_point = "HTTP: POST /sso/register and POST /sso/update-provider (save provider endpoints), then the OIDC sign-in callback GET /sso/callback/:providerId (server-side fetches)"
advisory = "GHSA-5rr4-8452-hf4v"
vulnerable_commit = "23094a628f007f801be6d26e5b15dc5fc6fc4eb8"
fix_commit = "37f60cb176cb53147da7dfd5ec15afa5b486e81e"
category = "Security"
tags = ["ssrf", "oidc", "sso", "input-validation", "data-producer-off-check-path"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
