schema_version = "1.1"

[task]
name = "cwe-bench/django-cms-object-level"
description = "django CMS admin page creation (duplicate / add translation / page-type source) lacks object-level checks on the client-chosen copy source and translation target"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-639"
language = "Python"
repo = "https://github.com/django-cms/django-cms"
source = "mined"            # mined | mined+injected | injected
entry_point = "HTTP POST /admin/cms/pagecontent/<id>/duplicate/, /admin/cms/pagecontent/add/, /admin/cms/placeholder/cms_wizard/create/"
advisory = "GHSA-6X92-6VX4-5FWR / CVE-2026-63003 / PYSEC-2026-3821"
vulnerable_commit = "3edf89a0a8bb06cdd54d2d22cba33ee7b72b5b82"
fix_commit = "3e1ccf7573eb1a74ebbbfaaa812c1f5cadf14e6c"
category = "Security"
tags = ["CWE-639", "CWE-862", "idor", "django", "admin", "pattern-A+B"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
