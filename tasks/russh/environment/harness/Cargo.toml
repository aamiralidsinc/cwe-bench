[package]
name = "russh-sec-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
russh = { path = "/app/russh", default-features = false, features = ["ring", "flate2", "rsa", "des"] }
tokio = { version = "1", features = ["full"] }
rand = { version = "0.10", features = ["thread_rng"] }
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519"] }
anyhow = "1"

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "functional"
path = "tests/functional.rs"

[lib]
path = "src/lib.rs"
