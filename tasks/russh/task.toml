schema_version = "1.1"

[task]
name = "cwe-bench/russh"
description = "Fix an SSH transport flaw where a MAC-requiring cipher can be negotiated with the null MAC, yielding an integrity-free session and an out-of-bounds crash on a short packet."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-129"
language = "Rust"
repo = "https://github.com/eugeny/russh"
source = "mined"
entry_point = "library API: russh server::run_stream / client::connect(_stream) SSH transport handshake (algorithm negotiation)"
advisory = "GHSA-p8qx-h547-fjw9"
vulnerable_commit = "3430fd26ecafc0dc3705210f5f39a9119fa22774"
fix_commit = "2885385abfee279092a41d80c6cb6ac367353159"
category = "Security"
tags = ["ssh", "negotiation", "integrity", "mac", "denial-of-service"]

[verifier]
environment_mode = "shared"
timeout_sec = 1500.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 6144
storage_mb = 20480
