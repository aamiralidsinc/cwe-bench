schema_version = "1.1"

[task]
name = "cwe-bench/webob-inv"
description = "Fix an open-redirect flaw in a WSGI request/response library's redirect handling."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-601"
language = "Python"
repo = "https://github.com/pylons/webob"
source = "mined"
entry_point = "library API: Response.location / HTTPFound(location=...) WSGI call / Request.relative_url()"
advisory = "GHSA-6hx8-3wjj-gr8g / CVE-2026-54770"
vulnerable_commit = "b240857958df492ef71bb00fb4b5365ecd92480a"   # parent of 54c1133, which added this advisory's regression tests (leak; fixed 2026-10-16)
fix_commit = "ff89560643fb252751b4db8806a283b5377f1f07"
category = "Security"
tags = ["open-redirect", "url-parsing", "wsgi", "python"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
