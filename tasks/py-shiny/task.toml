schema_version = "1.1"

[task]
name = "cwe-bench/py-shiny"
description = "Fix a path-traversal flaw in a Python web framework's server-side bookmark restore."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Python"
repo = "https://github.com/posit-dev/py-shiny"
source = "mined"
entry_point = "HTTP GET / with a client-supplied bookmark id in the query string (?_state_id_=...), which the server-side bookmark restore turns into a filesystem path"
advisory = "GHSA-47c3-hpmg-7j6p / CVE-2026-108258"
vulnerable_commit = "48b4faa0d651476afa84d6423d57503b60716902"
fix_commit = "1d8ecb46cbc9621b7dc8812111d26692e086b376"
category = "Security"
tags = ["path-traversal", "bookmark", "web", "python"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
