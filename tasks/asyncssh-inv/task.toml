schema_version = "1.1"

[task]
name = "cwe-bench/asyncssh-inv"
description = "Fix several co-present vulnerabilities in a Python SSH library: pre-key-exchange message injection, per-user authorized-keys path traversal, SCP download path traversal, and a zero-packet-size channel denial of service."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
cwe_ids = ["CWE-22", "CWE-287", "CWE-345", "CWE-354", "CWE-639", "CWE-835"]
language = "Python"
repo = "https://github.com/ronf/asyncssh"
source = "mined+stacking"
entry_point = "library API: an asyncssh server and client spoken over a loopback socket (raw transport handshake, public-key/password auth, the scp() client, and channel open)"
advisory = "CVE-2023-46445, CVE-2023-46446, CVE-2026-45309, CVE-2026-54591, CVE-2026-62949"
vulnerable_commit = "f67234fb3c36242be0c5c9f29e1fdbbe544fc4e0"
fix_commit = "83e43f5"
category = "Security"
tags = ["ssh", "path-traversal", "authentication", "denial-of-service", "python", "stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
