schema_version = "1.1"

[task]
name = "cwe-bench/mcp-atlassian-path-inj"
description = "Confine caller-supplied local file paths read by the MCP server across attachment uploads and file-sourced bodies"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Python"
repo = "https://github.com/sooperset/mcp-atlassian"
source = "injected"
entry_point = "MCP tools (jira create_issue/update_issue attachments & description, confluence create_page/update_page/add_comment file paths) and the equivalent JiraFetcher/ConfluenceFetcher public API"
advisory = "GHSA-2XJ6-XX86-CWWC"
vulnerable_commit = "4067d1db4097755cc6add87f95fe3f0746c98c0b"
fix_commit = "b041733473f95119dd539542a43c280737a8e460"
category = "Security"
tags = ["path-traversal", "arbitrary-file-read", "confused-deputy", "mcp"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
