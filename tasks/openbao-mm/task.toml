schema_version = "1.1"

[task]
name = "cwe-bench/openbao-mm"
description = "Stop identity-template substitutions from introducing pattern metacharacters into authorization patterns in OpenBao."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-863"
language = "Go"
repo = "https://github.com/openbao/openbao"
source = "injected"
entry_point = "HTTP: authenticated Vault-style API (sys/policy, identity/entity, PKI issue/sign roles, SSH sign roles)"
advisory = "GHSA-59W7-V8RR-PR4P / CVE-2026-71543 / GO-2026-6556"
vulnerable_commit = "681f6e2730f03f9cd2a5ce7d056fc957622cfe81"
fix_commit = "2d4ebafec5c524408b3d4ac1198df909cb7ac8c1"
category = "Security"
tags = ["authorization", "templating", "injection", "go"]

[verifier]
environment_mode = "shared"
timeout_sec = 1200.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
