schema_version = "1.1"

[task]
name = "cwe-bench/langchain-path-escape-inj"
description = "Confine model-supplied patterns and paths in agent file-search and file-tool middleware to the configured workspace."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Python"
repo = "https://github.com/langchain-ai/langchain"
source = "injected"         # real base flaw + same-class siblings injected into our copy (see build notes)
entry_point = "library API: FilesystemFileSearchMiddleware glob/grep tools and the Claude text-editor/memory file tools"
advisory = "GHSA-GR75-JV2W-4656"   # CVE-2026-55443; never appears in instruction.md
vulnerable_commit = "0392b6bae4bdfc0b7ed5aeb2e9e414bbb7ea643b"
fix_commit = "dcaf7795a3e6590af55c3ff7bda6add6355e9ea6"
category = "Security"
tags = ["path-traversal", "symlink-escape", "prefix-allowlist", "agent-middleware"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
