schema_version = "1.1"

[task]
name = "cwe-bench/olivetin-allowlist-inj"
description = "Keep request-supplied and identity-derived values from reaching OliveTin's action command and environment without a safety check."

authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-20"
language = "Go"
repo = "https://github.com/OliveTin/OliveTin"
source = "injected"
entry_point = "Action execution via the executor (StartAction / StartActionAndWait API and webhook/trigger callers); tests drive executor.Executor.ExecRequest as the project's own executor tests do"
advisory = "GHSA-PRJ9-97MP-MWH2 / CVE-2026-53541 / GO-2026-5552"
vulnerable_commit = "41612c6bc6a8a6424e27e6a66fb0dae30524c768"
fix_commit = "ebffd9f040f791208aee1db2e5a8aecd1e3e603d"
category = "Security"
tags = ["improper-input-validation", "command-injection", "allowlist-bypass", "go"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 6144
storage_mb = 20480
