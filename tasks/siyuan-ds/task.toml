schema_version = "1.1"

[task]
name = "cwe-bench/siyuan-ds"
description = "Publish-mode access control bypass for static resources in SiYuan"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862"
language = "Go"
repo = "https://github.com/siyuan-note/siyuan"
source = "injected"
entry_point = "HTTP GET/HEAD on the kernel static resource routes and POST on the installed-package listing and custom emoji APIs"
advisory = "GHSA-FGMR-7W36-9QFQ / CVE-2026-72796 / GO-2026-6423"
vulnerable_commit = "fd6d23d7bbe84da9f24286e7485453ca84831f48"
fix_commit = "34be6c0bb0739d5b8e99ecc0cbfb474abb16230d"
category = "Security"
tags = ["cwe-862", "authorization", "publish", "static-files"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
