schema_version = "1.1"

[task]
name = "cwe-bench/nhost-cors-auth"
description = "Local Nhost configuration service (nhost dev) answers any browser origin and hands out stored secret values"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-942"
language = "go"
repo = "https://github.com/nhost/nhost"
source = "mined"            # mined | mined+injected | injected
entry_point = "HTTP POST/OPTIONS /v1/configserver/graphql and /v1/logs/graphql of the hidden CLI command `nhost configserver` (run by `nhost dev up`)"
advisory = "GHSA-64CJ-QVX5-M4F3 / CVE-2026-47671 / GO-2026-5166"
vulnerable_commit = "da4e00011f773a2f219150549b2d32a1bd5ef582"
fix_commit = "e407511627d2c2c1137a70e9ca1ca31095d23479"
category = "Security"
tags = ["go", "cors", "missing-authentication", "secret-exposure", "CWE-306", "CWE-200", "pattern-A"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
