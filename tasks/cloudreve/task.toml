schema_version = "1.1"

[task]
name = "cwe-bench/cloudreve"
description = "Fix several co-present vulnerabilities in a self-hosted cloud file-management server (access control, path traversal, information disclosure, and resource-exhaustion), reachable through its HTTP API."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-863,CWE-22,CWE-200,CWE-359,CWE-400,CWE-770"
language = "Go"
repo = "https://github.com/cloudreve/cloudreve"
source = "mined+stacking"
entry_point = "HTTP: requests to a running Cloudreve server's /api/v4 endpoints (account search, file thumbnail, WOPI editor session endpoints, server-event stream) and its share mechanism"
advisory = "GHSA-8r7f-r8hj-r3rv,GHSA-g9j2-8w95-3vwv,GHSA-49h3-cwhj-4737,GHSA-c3jm-gv5r-9wcp,GHSA-w8x7-h2px-xmq8"
vulnerable_commit = "54dc81deefcd799300119d0b9bc19c935a0881b5"
fix_commit = "0b00dd308f132d6e6e8476857ef79f4865600bbc"
category = "Security"
tags = ["go", "access-control", "path-traversal", "information-disclosure", "dos", "wopi", "sse", "stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 1500.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 16384
