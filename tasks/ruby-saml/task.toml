schema_version = "1.1"

[task]
name = "cwe-bench/ruby-saml"
description = "Fix multiple co-present security flaws in a SAML relying-party library (signature-wrapping acceptance and resource-exhaustion via SAML messages)."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-347,CWE-287,CWE-400,CWE-770"
language = "ruby"
repo = "https://github.com/saml-toolkits/ruby-saml"
source = "mined+stacking"            # stacking build: several real co-present CVEs at one commit
entry_point = "library API: OneLogin::RubySaml::Response / SloLogoutrequest validating a received SAML message"
advisory = "CVE-2024-45409,CVE-2025-25293,CVE-2025-54572"   # never appears in instruction.md
vulnerable_commit = "148a4c2de713a98c58c28bbc7785c05698216a4d"
fix_commit = "4865d030cae9705ee5cdb12415c654c634093ae7"
category = "Security"
tags = ["stacking", "saml", "signature-verification", "authentication-bypass", "dos", "mined+stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
