schema_version = "1.1"

[task]
name = "cwe-bench/hermes-agent-ds"
description = "Keep attacker-influenced text out of the agent's system prompt and model context, on every context, memory and tool-result path."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-74"
language = "Python"
repo = "https://github.com/nousresearch/hermes-agent"
source = "injected"         # real base flaw + same-class siblings injected into our copy (see build notes)
entry_point = "library API: agent.prompt_builder.build_context_files_prompt / load_soul_md, agent.subdirectory_hints.SubdirectoryHintTracker.check_tool_call, tools.memory_tool.MemoryStore.load_from_disk and memory_tool(), agent.tool_dispatch_helpers.make_tool_result_message, agent.memory_manager.MemoryManager.build_system_prompt / build_memory_context_block, agent.transports.codex_event_projector.CodexEventProjector.project"
advisory = "GHSA-33QV-C5QM-799V"   # CVE-2026-10223; never appears in instruction.md
vulnerable_commit = "b6ce7a451f72a185ceafc4a3d13a599ee00a62d5"
fix_commit = "0dee92df22bdc0cfbcad90ca954aa14916f018de"
category = "Security"
tags = ["prompt-injection", "untrusted-content", "context-assembly", "multi-site"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
