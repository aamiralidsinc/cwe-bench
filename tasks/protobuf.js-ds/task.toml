schema_version = "1.1"

[task]
name = "cwe-bench/protobuf.js-ds"
description = "Untrusted names in protobuf text, JSON, schema, descriptor and plain-object input can reach or replace the prototype of objects the library returns or stores."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-1321"
language = "JavaScript"
repo = "https://github.com/protobufjs/protobuf.js"
source = "injected"
entry_point = "library API: text-format message parsing (textformat.fromText), plus JSON parsing, schema compilation, descriptor import, plain-object conversion, schema settings and static code generation"
advisory = "GHSA-JFJ6-75FJ-8934"
vulnerable_commit = "1aca107aa7938d1e49a25f9653186db2f40a0253"
fix_commit = "9f97fe413072d3beb52c74e62d88ea8adc9444d8"
category = "Security"
tags = ["prototype-pollution", "inherited-property", "protobuf", "text-format", "schema"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
