schema_version = "1.1"

[task]
name = "cwe-bench/electron-builder-ds"
description = "electron-builder's updater, build tooling and publisher clients send credential headers other than the exact lower-case `authorization` to another origin on a redirect, block-based update downloads follow redirects with all request headers, a publisher added in this copy re-sends its upload credential to a storage redirect and prints it, and configured secrets appear in clear in JSON request-body debug output, JSON error text, command errors and publisher token errors."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-200"
language = "TypeScript"
repo = "https://github.com/electron-userland/electron-builder"
source = "injected"          # upstream advisory fix + real uncovered routes + a realistic added publisher
entry_point = "library API: electron-updater AppUpdater (NsisUpdater) checkForUpdates()/downloadUpdate() over Electron net with requestHeaders/addAuthHeader or a GitLab token; builder-util httpExecutor.request()/downloadToBuffer(); electron-publish GitHubPublisher/GitlabPublisher/GiteaPublisher constructors and GiteaPublisher.upload(); builder-util exec(); DEBUG=electron-builder output"
advisory = "GHSA-P2F4-R6V6-J797"
vulnerable_commit = "8a035f836bb79d5346c69246530190dd72ec4519"
fix_commit = "22a7532bd01b9fb42cff7c58d599c7ad683569fe"
category = "Security"
tags = ["credential-leak", "redirect", "auth-header", "log-redaction", "typescript", "node", "electron", "trap-stack", "uncovered-route", "injected-sibling"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
