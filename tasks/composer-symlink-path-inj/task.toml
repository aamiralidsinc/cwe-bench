schema_version = "1.1"

[task]
name = "cwe-bench/composer-symlink-path-inj"
description = "Confine a dependency's declared binaries to its own install directory before making them executable or proxying them."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "PHP"
repo = "https://github.com/composer/composer"
source = "injected"         # real base flaw + same-class siblings injected into our copy (see build notes)
entry_point = "CLI: install/update/reinstall of a dependency (library API: the bin install/download/refresh methods)"
advisory = "GHSA-96H3-5X6V-M776"   # CVE-2026-59944; never appears in instruction.md
vulnerable_commit = "24e396b5279a92fadf4897dd701d2cb97942cda3"
fix_commit = "53b8bb4c24697b2f00a18cf1ef35a10392701b89"
category = "Security"
tags = ["path-traversal", "symlink-escape", "permission-change", "dependency-manager"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
