schema_version = "1.1"

[task]
name = "cwe-bench/stigmem"
description = "Fix multiple co-present security flaws in a federated memory node: unapproved peer activation, insecure/unauthenticated startup on public addresses, unacknowledged unsigned-plugin and quota-disable modes, and world-readable local storage."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862,CWE-285,CWE-863,CWE-319,CWE-489,CWE-494,CWE-770,CWE-732"
language = "python"
repo = "https://github.com/eidetic-labs/stigmem"
source = "mined+stacking"
entry_point = "HTTP federation API (peer registration + federation data endpoints), node service startup/configuration validation, and the plugin-registration path"
advisory = "GHSA-9vp8-3hmv-8fgh,GHSA-fp6w-8wpg-74g5,GHSA-jmfc-hfjq-pxcp,GHSA-w7pm-9g55-mxfm,GHSA-xh5j-xjfq-qvvx,GHSA-9pc9-4crj-mhpj"
vulnerable_commit = "66f4fa6a83071a313c1f9bd624a27b4a5ac56a2a"
fix_commit = "ff97d514a2d1d6a086ae129c990baf0487f52935"
category = "Security"
tags = ["stacking", "python", "fastapi", "federation", "authorization", "access-control", "transport-security", "code-integrity", "mined+stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
