schema_version = "1.1"

[task]
name = "cwe-bench/vibe-trading-path-read"
description = "Agent tools read and write server files outside the upload area, run storage and configured directories"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "python"
repo = "https://github.com/hkuds/vibe-trading"
source = "mined"            # mined | mined+injected | injected
entry_point = "agent tool calls via AgentLoop (POST /sessions/{id}/messages; MCP tools)"
advisory = "GHSA-5RMQ-CHC7-M22F"
vulnerable_commit = "fd767f5c29c72cffe8e3f89c7ff006cb3041397f"
fix_commit = "9454d4a27a763b80e1d6eb5763b86c88e9e4e714"
category = "Security"
tags = ["path-traversal", "arbitrary-file-read", "CWE-23", "CWE-552", "pattern-A+B"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
