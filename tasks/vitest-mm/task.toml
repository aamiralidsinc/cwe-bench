schema_version = "1.1"

[task]
name = "cwe-bench/vitest-mm"
description = "Close missing-authorization and path-confinement gaps on the Vitest test-runner control API."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-862"
language = "TypeScript"
repo = "https://github.com/vitest-dev/vitest"
source = "injected"
entry_point = "WebSocket RPC to the test-runner API server (UI API), the browser-mode file command API, and the HTTP test-evidence endpoints those servers expose"
advisory = "GHSA-5XRQ-8626-4RWP / CVE-2026-47429"
vulnerable_commit = "76c4397b58618b6b430b0800487995c77bb6dad7"
fix_commit = "20e00ef7808de6d330c5e2fda530f686e08f1c8d"
category = "Security"
tags = ["CWE-862", "CWE-22", "authorization", "path-traversal", "api", "websocket"]

[verifier]
environment_mode = "shared"
timeout_sec = 1200.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 8192
storage_mb = 20480
