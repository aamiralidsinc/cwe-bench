schema_version = "1.1"

[task]
name = "cwe-bench/tinacms-ds"
description = "Confine caller-supplied media object keys to the configured media root across every first-party storage adapter and media route"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-639"
language = "TypeScript"
repo = "https://github.com/tinacms/tinacms"
source = "mined+injected"
entry_point = "Media API route handlers of the first-party storage adapters: presigned upload, direct upload, single and batch delete, copy/move, and listing, on the S3, DigitalOcean Spaces, Azure Blob and Cloudinary backends"
advisory = "GHSA-8MQ9-5FW2-5RM4"
vulnerable_commit = "d08ffb40de47f8c8296646b9076af79a26d76c47"
fix_commit = "d44558e9b4502d4f4fc2c970d22985339fe2b6ce"
category = "Security"
tags = ["broken-access-control", "object-key", "path-traversal", "media", "cwe-639"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
