schema_version = "1.1"

[task]
name = "cwe-bench/actualbudget"
description = "Fix several co-present security flaws in a self-hosted budgeting app's HTTP sync server: missing authentication, broken per-file authorization, path traversal, privilege escalation, secret enumeration and insufficient session expiration."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-306,CWE-862,CWE-863,CWE-22,CWE-284,CWE-285,CWE-613"
language = "TypeScript"
repo = "https://github.com/actualbudget/actual"
source = "mined+stacking"
entry_point = "HTTP requests to the sync-server API: bank-sync status endpoints, the /sync/* file endpoints (upload/download/get-info/rename/key/reset/sync), /account login & change-password, the /secret existence probe, and session validation on protected routes"
advisory = "GHSA-m2cq-xjgm-f668,GHSA-qmjj-p7m9-wjrv,GHSA-27vg-33gh-4hwg,GHSA-prp4-2f49-fcgp,GHSA-3f62-qv96-4p78,GHSA-cq9c-6w48-qmfg (CVE-2026-27584,CVE-2026-27638,CVE-2026-3089,CVE-2026-33318,CVE-2026-46700,CVE-2026-49229)"
vulnerable_commit = "0d6742664b7a5f111013bc6392bf3fda5e2c8a7c"
fix_commit = "111ea5f71ce97105376bd1472f2e1f3fa22139ad"
category = "Security"
tags = ["stacking", "authorization", "authentication", "session", "path-traversal", "privilege-escalation", "node", "typescript", "mined+stacking"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
