schema_version = "1.1"

[task]
name = "cwe-bench/rclone-sib"
description = "Fix authentication bypasses across several of a cloud storage tool's network serve surfaces."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-287"
language = "Go"
repo = "https://github.com/rclone/rclone"
source = "mined+injected"
entry_point = "Network clients to a running `rclone serve` process: S3 SigV4, HTTP Basic auth, FTP login and SSH (sftp) login on localhost"
advisory = "GHSA-xwwr-4h3p-r22c"
vulnerable_commit = "b3cf0444a2a3345f81d53919f38b28ef8630e6e7"
fix_commit = "90595f34f27f569be6b27c57fe5ab65057d323bd"
category = "Security"
tags = ["go", "authentication", "serve", "s3", "http", "ftp", "sftp"]

[verifier]
environment_mode = "shared"
timeout_sec = 1500.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020, 2026-10-16)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 6144
storage_mb = 14336
