schema_version = "1.1"

[task]
name = "cwe-bench/class-transformer-exclude-sib"
description = "Fix property protections (exclusion, groups, versions, whole-class exclusion) that a TypeScript transformation library silently drops for renamed properties and subclasses (mass assignment)."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-915"
language = "TypeScript"
repo = "https://github.com/typestack/class-transformer"
source = "injected"         # no advisory or merged fix: real, pre-existing gaps in unmodified upstream code (see build notes)
entry_point = "library API: plainToInstance / plainToClassFromExist / instanceToPlain with @Exclude / @Expose declarations"
advisory = "none (open upstream bug reports #1030, #1832, #1097, #95; no advisory, no merged fix)"
vulnerable_commit = "a2734a5d154c9b0beb9a10555a04416bc371de06"   # develop HEAD 2025-01-17, version 0.5.1
fix_commit = "none (reference fix written by the builder)"
category = "Security"
tags = ["mass-assignment", "excluded-properties", "serialization", "typescript"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
