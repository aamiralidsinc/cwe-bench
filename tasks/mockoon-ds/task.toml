schema_version = "1.1"

[task]
name = "cwe-bench/mockoon-ds"
description = "Mockoon's local mock-server management API answers any caller and any browser origin, exposes credentials from recorded transactions, and writes arbitrary process environment variables"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-306"
language = "typescript"
repo = "https://github.com/mockoon/mockoon"
source = "injected"            # mined | mined+injected | injected
entry_point = "HTTP management API under /mockoon-admin* of the Mockoon server, reached through the public server class, the serverless wrapper and the runtime transaction logger"
advisory = "GHSA-RQX4-3F6Q-3X2V / CVE-2026-59148"
vulnerable_commit = "b42bdfb7f82e83f0e81bea8e6fe41adf5ec82585"
fix_commit = "c420b5a56918475b8663977b51e5f986e45b3299"
category = "Security"
tags = ["typescript", "missing-authentication", "cors", "sensitive-data-exposure", "CWE-306", "CWE-352", "CWE-942", "pattern-A"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
