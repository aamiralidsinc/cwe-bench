entry_point = "Public library API: new Handlebars(loader).compile(name) / loader.sourceAt(name), template partial references, and a Spring MVC controller view name resolved through the view resolver"
advisory = "GHSA-G29J-RWFV-H99W"
vulnerable_commit = "c95855064f48f1a66af2a5da5a9c1522d7f57264"
