schema_version = "1.1"

[task]
name = "cwe-bench/astro-csrf-origin"
description = "Astro: cross-site form submissions reach actions, endpoints and pages when the request pipeline is composed from the composable building blocks"
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-352"
language = "TypeScript"
repo = "https://github.com/withastro/astro"
source = "mined"            # mined | mined+injected | injected
entry_point = "HTTP POST to an on-demand route through astro/hono (actions(), pages()) and astro/fetch (actions(state), pages(state))"
advisory = "GHSA-8MV7-9C27-98VC / CVE-2026-73423"
vulnerable_commit = "79aa99c648b4b40b95a31d4a961b77074cf7963c"
fix_commit = "0b30b35f864310bee8485c952d1877e82e2b9b1a"
category = "Security"
tags = ["csrf", "origin-check", "pattern-A", "mined"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
