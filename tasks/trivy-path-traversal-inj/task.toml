schema_version = "1.1"

[task]
name = "cwe-bench/trivy-path-traversal-inj"
description = "Confine plugin-name-derived file operations to the plugin directory in the Trivy plugin manager."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-22"
language = "Go"
repo = "https://github.com/aquasecurity/trivy"
source = "injected"
entry_point = "CLI: trivy plugin <install|uninstall|refresh|prefetch> NAME; Go API: pkg/plugin.Manager"
advisory = "GHSA-8RC5-4FR6-64PW / CVE-2026-63328"
vulnerable_commit = "246ee3ca56b666e3c6e6462bf7c0ecd6f059341a"
fix_commit = "d4213d7735c74e57f06c02ccb39ebca67abc7959"
category = "Security"
tags = ["path-traversal", "plugins", "go"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 6144
storage_mb = 20480
