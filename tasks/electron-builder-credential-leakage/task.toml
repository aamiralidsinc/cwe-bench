schema_version = "1.1"

[task]
name = "cwe-bench/electron-builder-credential-leakage"
description = "electron-builder's HTTP clients (the electron-updater Electron executor and the Node executor used for publishing) forward credential headers other than lower-case `authorization` to another origin on a redirect, the block-based update download follows redirects with all headers, and publish tokens / request bodies appear in clear in errors and debug output."
authors = [{ name = "mason-skillmaker" }]

[metadata]
cwe_id = "CWE-200"
language = "TypeScript"
repo = "https://github.com/electron-userland/electron-builder"
source = "mined"            # upstream advisory fix + one real pre-existing route at the same commit (nothing injected)
entry_point = "library API: electron-updater AppUpdater (NsisUpdater) checkForUpdates()/downloadUpdate() with requestHeaders/addAuthHeader or a GitLab token, over Electron net; builder-util httpExecutor.request()/downloadToBuffer() used by publishers; electron-publish GitHubPublisher/GitlabPublisher constructors; DEBUG=electron-builder output"
advisory = "GHSA-P2F4-R6V6-J797"
vulnerable_commit = "8a035f836bb79d5346c69246530190dd72ec4519"
fix_commit = "22a7532bd01b9fb42cff7c58d599c7ad683569fe"
category = "Security"
tags = ["credential-leak", "redirect", "auth-header", "log-redaction", "typescript", "node", "electron", "trap-stack", "uncovered-route"]

[verifier]
environment_mode = "shared"
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"   # offline like CWE-bench: only the model APIs (arXiv 2610.17020)
allowed_hosts = ["api.deepseek.com", "api.xiaomimimo.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
