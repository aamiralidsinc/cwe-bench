# Stage contracts: for each pipeline stage, the build/<slug>/ markers and files it reads, the ones it writes, and
# when it counts as successful. Marker names and meanings: common/markers.py (MARKERS). Human-readable version and
# the follow-ups: docs/STAGE-CONTRACTS.md. `python3 common/markers.py check <slug>` reports folders that break
# these contracts. Paths are relative to build/<slug>/ unless they start with tasks/ or a ~ path.

[build]
script = "common/launch/run_build.sh (via pipelines/sibling/6-build/run_pipeline.sh or pipelines/stacking/3-build-gate/run_stack_pipeline.sh)"
reads = ["BUILD-PROMPT.md"]
writes = ["start_utc.txt", "end_utc.txt", "build-exit.txt", "build-run.json", "build_status.json", "pipeline.log | stack_pipeline.log", "tasks/<slug>/", "checks/", "manifest.json"]
success = "end_utc.txt not older than start_utc.txt, builder status ok, at least 5 task files; then the post-build checks run"
never = "writes a gate verdict flag"

[build_resume]
script = "common/queue/kinds/build_resume.py -> pipelines/sibling/6-build/resume_pipeline.sh"
reads = ["build-exit.txt", "build_status.json", "end_utc.txt", "~/.claude/projects/*/*.jsonl"]
writes = ["resume_start_utc.txt", "end_utc.txt", "build-exit.txt", "build-run.json", "build_status.json", "pipeline.log", "tasks/<slug>/"]
success = "the resumed builder ran after the job started and the build has an outcome (gate marker or a resumed-build log line)"
never = "starts a fresh build (that would wipe tasks/<slug>); runs for a declined build, a genuine timeout or a stacking task"

[gate]
script = "common/gate/gate_one_ds.sh"
reads = ["tasks/<slug>/", "checks/", "manifest.json"]
writes = ["exactly one of .sound | .unsound | .gate_error", "gate_fingerprint.json (only with .sound; removed otherwise)", "gate_report*.json", "evidence/"]
success = ".sound with a gate_fingerprint.json matching the gated files"

[postbuild]
script = "common/gate/postbuild.sh"
reads = [".sound (from the gate)", "checks/blind.patch", "listing.json (stacking)"]
writes = [".gate_passed (while the post-gate checks run)", ".blind_fail", ".listing_warn", ".listing_fail", ".sound", "gate_fingerprint.json", "postbuild.log RESULT line"]
success = "last postbuild.log RESULT is SOUND and .sound is present; .gate_passed is gone"

[regate]
script = "common/gate/regate.sh [--listing]"
reads = ["checks/blind.patch (reused)", "listing.json (reused)", "tasks/<slug>/"]
writes = [".gate_passed (transient)", ".sound | .unsound | .gate_error | .listing_fail", ".blind_fail", "gate_fingerprint.json", "postbuild.log RESULT line"]
success = "a RESULT line newer than the start and a marker that matches it"

[blind_fix]
script = "common/blindfix/run_blindfix.sh"
reads = ["tasks/<slug>/instruction.md", "the task image"]
writes = ["checks/blind.patch", "blind_status.txt"]
success = "checks/blind.patch exists and passes the patch check (otherwise checks/blind.failed.patch + .blind_fail, not blocking)"

[listing_check]
script = "pipelines/stacking/4-listing/run_listing_check.sh + listing_verdict.py; rewrites: pipelines/stacking/5-upgrade/run_upgrade_stack.sh"
reads = ["tasks/<slug>/instruction.md", "manifest.json (traps)"]
writes = ["listing.json", "listing_status.txt", ".listing_fail | .listing_warn (through postbuild.sh / regate.sh)"]
success = "listing_verdict.py exit 0; at most 3 tries (build + 2 rewrites), then the owner decides (LISTING_WAIVER.md to trial, or drop)"

[test_repair]
script = "people / repair scripts; follow-up by the work queue (reconcile rules R1-R4)"
reads = ["tasks/<slug>/tests/"]
writes = ["repaired-tests-<date>/ or removed-tests-<date>/ (originals + README.md)", ".hold-repair (until the regrades are in)", "tasks/<slug>/tests/ (one atomic copy)"]
success = "re-gate SOUND on the changed files, every graded run regraded or rescored, .hold-repair released"

[trial]
script = "common/trial/trial.py -> common/trial/run_trial.sh"
reads = [".sound", "gate_fingerprint.json (must be current)", "hold_<model>", ".hold-repair (queue)"]
writes = ["runs_<model>.log (one line per run)", "~/.tb-graders/cwe/jobs/<job>/<trial>/"]
success = "the runs log gained the planned run numbers"
never = "starts on a stale fingerprint or a held model"

[audit_prep]
script = "common/audit/postmortem.py prepare"
reads = ["trial folder", "tasks/<slug>/", "build notes"]
writes = ["<trial>/postmortem-<UTC>/ (AUDITOR_BRIEF.md, PREPARED.json, evidence/)"]
success = "a new PREPARED.json"

[audit_record]
script = "common/audit/postmortem.py record-ready + audit_results.py"
reads = ["<trial>/postmortem-*/verdict.json"]
writes = ["build/audit/ledger.md", "build/audit/trials.tsv"]
success = "ledger and trials.tsv rewritten after the start"

[fairness]
script = "pipelines/sibling/9-fairness/run_fairness.sh | pipelines/stacking/7-fairness/run_fairness_stack.sh"
reads = ["tasks/<slug>/", "audited runs"]
writes = ["FAIRNESS.md", "fairness_status.txt"]
success = "FAIRNESS.md newer than the start, fairness_status.txt ok, a GATE_A READY or NOT_READY verdict"

[decision]
script = "people (the owner); `cweq delivered` appends the DELIVERED line"
reads = ["FAIRNESS.md", "audited ledger"]
writes = ["HUMAN-DECISION.md (DECISION, DATE, WHY; DELIVERED after the push)", "LISTING_WAIVER.md"]
success = "a dated DECISION line; DELIVERED only after KEEP"

[delivery_prep]
script = "common/queue/delivery.py (export_delivery.py)"
reads = ["HUMAN-DECISION.md (KEEP)", "build/audit/delivered.tsv", "counted runs"]
writes = ["~/.tb-graders/cwe/deliveries/<UTC>-<slug>/ (tasks/, trajectory/, ready.json)"]
success = "ready.json with ready=true and a clean secret scan"

[lint]
script = "common/queue/lintstep.py (common/lint/task_lint.py)"
reads = ["tasks/<slug>/tests/", "gate_fingerprint.json"]
writes = ["lint/<fp16>.json"]
success = "lint/<fp16>.json for the current gate version (warning-only; never blocks)"

[cleanup]
script = "common/util/hourly_cleanup.sh once"
reads = [".hold-repair (held tasks keep their containers and images)"]
writes = ["build/audit/hourly_cleanup.log"]
success = "a `pass done` line"
