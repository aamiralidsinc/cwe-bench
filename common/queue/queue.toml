# Work-queue settings (common/queue/, docs/WORK-QUEUE.md). Every key is optional: config.py holds the defaults.
# Point cweq at another file with --config or CWEQ_CONFIG.

# The job table (SQLite, WAL mode). Deleting it loses only work in flight: `cweq reconcile` rebuilds it from disk.
db = "~/.tb-graders/cwe/queue.db"
# One log per job: <log_dir>/<id>-<kind>-<task>.log
log_dir = "~/.tb-graders/cwe/queue-logs"
# Trial folders (<jobs_dir>/<job>/<task>__<id>/), the same folder audit_results.py reads.
jobs_dir = "~/.tb-graders/cwe/jobs"

# Master switch. false = `dispatch` starts nothing (reconcile still records what it would do). See WORK-QUEUE.md.
enabled = true
# The dispatcher starts nothing until `cweq adopt` has recorded the running pipeline's state with no conflicts
# (adopt.py): the queue continues from where the pipeline stands and never redoes finished work.
require_adoption = true

[dispatch]
tick_sec = 30                 # dispatch loop period
# Staggered starts (simultaneous container spin-up starves sshd): seconds between two starts, [low, high] = random.
fill_spacing_sec = [15, 40]   # during the first fill after the dispatcher starts
start_spacing_sec = [2, 8]    # afterwards
max_starts_per_tick = 3
lease_sec = 600               # a worker refreshes its lease every lease_sec/10; an expired lease = a stale worker
aging_per_hour = 10           # effective priority = priority + aging_per_hour x hours waited
max_running_total = 69        # every kind together, old-script builds and trials included; the BASE of [autolimit]
# build, gate, regate, regrade and rescore run alone on a task; trial_runs of one task may run side by side up to this.
max_running_per_task = 6
# Old-script processes that hold slots of these kinds (drain: the old schedulers' and scripts' work still running).
count_foreign = ["build", "trial_run", "regate", "fairness"]
# Bookkeeping kinds (phase 4): outside max_running_total and the machine limits (cleanup must run when disk is short).
light_kinds = ["audit_prep", "audit_record", "cleanup", "step3", "lint"]
# Trials wait while builds running + builds queued >= this (scale_queue.py --trial-threshold).
trials_wait_builds = 999     # off: trials run alongside builds

# The total limit follows sustained CPU idle time, never one reading (autolimit.py; the monitor decides once a minute).
# Up one step when CPU idle stayed >= raise_idle_pct for raise_window_min and work is queued; down one step (never
# below max_running_total) when idle stayed <= lower_idle_pct for lower_window_min. "Stayed" = at least min_share of
# the window's samples, and samples cover min_coverage of the window. No second change within cooldown_min.
# Lowering stops nothing; it only admits fewer new jobs. Every change: a row in table autolimit + event limit.changed.
[autolimit]
enabled = true
ceiling = 85
step = 4
raise_idle_pct = 25
raise_window_min = 60
lower_idle_pct = 5
lower_window_min = 30
min_share = 0.9
min_coverage = 0.8
cooldown_min = 60

# Phase 3 (phase3.py): builds, trials and stale gates of the tasks in pipelines/router/out/batches/*.txt, in file
# order (files by name, lines as written). Batch-file headers: `# priority: <int>` is added to the batch's build and
# trial priorities (a later batch gets a lower number, so its builds start after the earlier batch's); `# hold: yes`
# keeps the batch's builds waiting (built tasks still gate and trial; running builds finish).
[phase3]
enabled = true
batches = []                  # batch names (file stems) to serve; empty = every batch file
max_launches = 3              # trial launch groups per (task, model, version) without a verdict before a person looks

# Phase 4 (phase4.py): what auto_advance.sh and the hourly_cleanup.sh loop did. Each switch turns one rule off.
[phase4]
enabled = true
audits = true                 # audit_prep (evidence folders, audit_ready.txt) and audit_record (record-ready + ledger)
fairness = true               # fairness review of BREAKER candidates in the batches
cleanup = true                # hourly_cleanup.sh once, one job per UTC hour (not while the old loop runs)
step3 = true                  # router step 3, one job per UTC half hour

[reconcile]
tick_sec = 120
# Tasks whose name starts with one of these get `regate.sh <slug> --listing` (same rule as router/regate_queue.py).
listing_prefixes = ["stk-"]
# Re-apply .hold-repair after a re-gate of a held task (regate.sh writes .sound; the repair scripts move it back).
rehold_after_regate = true

# A process whose command line matches one of these and names a task (in its arguments, or inside a small file it
# was started with, such as a regate_queue.py list) makes the task busy: the queue neither plans nor starts its jobs.
[busy]
patterns = ["regate", "regrade", "rescore", "postbuild.sh", "gate_one_ds.sh", "common/gate/gate.py", "repair",
            "fairfix", "upgrade", "run_stack_pipeline.sh", "run_pipeline.sh", "run_build.sh", "fingerprint.py"]

# Admission: no job starts while any limit is exceeded. Same thresholds as router/ORCHESTRATOR.md 4.4.
[limits]
min_free_disk_gb = 150        # measured on the repo's file system
max_load = 250                # 1-minute load average
min_mem_available_gb = 30     # MemAvailable
max_tmp_inode_pct = 90        # /tmp inodes in use

[limits.max_running]          # per kind; a kind not listed here never starts
regate = 15                   # re-gates still running under the per-batch schedulers count too
regrade = 3
rescore = 2
build = 24                    # 2026-10-28 owner: 32 -> 24 so gated batch-4 tasks gate and trial first; old-script builds count too
trial_run = 56                 # 2026-10-28 owner: 40 -> 56 so batch-4 tasks start trials as soon as their gates pass (build cap stays 24)
audit_prep = 4
audit_record = 1
fairness = 3                  # LLM reviews on DeepSeek; old-script reviews count too
cleanup = 1
step3 = 1
delivery_prep = 1             # export + secret scans of one kept task (delivery.py)
lint = 2                      # task-quality lint per task version (lintstep.py; warning-only)
build_resume = 4              # a paused-then-cut builder continues in its own session (kinds/build_resume.py)

# Disk floor per kind: a diskguard name (common/util/diskguard.py); the GB values live in limits.env, read live.
[limits.disk_floor]
build = "DISK_MIN_FREE_GB_BUILD"
build_resume = "DISK_MIN_FREE_GB_BUILD"
trial_run = "DISK_MIN_FREE_GB_TRIAL"
regate = "DISK_MIN_FREE_GB_GATE"

[priority]                    # default priority per kind (higher starts first)
regate = 50
rescore = 40
regrade = 30
build = 25
trial_run = 20
cleanup = 70
audit_record = 60
audit_prep = 55
fairness = 45
step3 = 10
delivery_prep = 35
lint = 15
build_resume = 26

[max_attempts]                # starts before a job is blocked (dead or stale workers, retryable exits)
regate = 2
regrade = 2
rescore = 2
build = 1                     # a build is never restarted on its own (a declined build is final)
trial_run = 1                 # a dead trial worker is not re-run blindly; the reconciler plans the next run afresh
audit_prep = 1
audit_record = 1
fairness = 1                  # a review that did not finish shows for a person (fairness_status.txt)
cleanup = 1
step3 = 1
delivery_prep = 1
lint = 1
build_resume = 1

# Exit codes that requeue the job (attempts + 1) instead of failing it. regate.sh exit 2 = gate error
# (infrastructure: overload, timeouts), which the orchestrator re-gates once.
[retry_exit_codes]
regate = [2]

# Exit codes that count as done. trial.py exits 2 when some runs were ungraded: the reconciler plans the next run.
[ok_exit_codes]
trial_run = [0, 2]

# Environment per kind (the scale_queue.py settings).
[env.trial_run]
CWE_AGENT_TIMEOUT_MULT = "1.5"   # agent limit x1.5: the 2 h tasks run at 3 h; a 3 h timeout counts as a model fail

# Job kinds are declared in common/queue/kinds/ (one file per kind: command, check, defaults). Extra folders of
# declarations load the same way; every default above can be overridden here.
[kinds]
extra_dirs = []

# Optional: replace a kind's command (testing, or a dry exercise on a new machine). Fields: {task} {trial} {job_id}.
# [commands]
# regate = ["sleep", "5"]

# Post-condition checks (checks.py, docs/RULES.md): a job that exits with an ok code is `done` only when the files show
# its outcome; otherwise `failed` (or `blocked` where a person must look), with the check named.
[checks]
enabled = true
# Hold regrade/rescore jobs while the newest real `cweq selfcheck --run` of that tool failed.
refuse_on_failed_selfcheck = true
selfcheck_dir = "~/.tb-graders/cwe/selfcheck"
# The event queue (events.py): which job ends and which stages emit an event, and which kinds jump the line.
[events]
job_done_kinds = ["build", "build_resume", "regate", "regrade", "rescore", "fairness", "delivery_prep"]
stages = ["awaiting_audit", "awaiting_fairness", "fairness_not_ready", "awaiting_decision", "kept", "delivered",
          "trials_stuck", "listing_fail", "gate_failed", "build_stopped", "not_breaker", "stale_gate"]
urgent = ["disk.critical", "adoption.conflict", "process.frozen"]
disk_critical_gb = 130

# Delivery (delivery.py): delivery_prep packages go to out_dir; the push itself stays with a person.
# Task-quality lint (lintstep.py): one warning-only `lint` job per SOUND batch task and gate version.
[lint]
enabled = true

[delivery]
enabled = true
out_dir = "~/.tb-graders/cwe/deliveries"
repo_label = "marahassan8/cwe-bench main"   # as written in the DELIVERED line of HUMAN-DECISION.md
# Resource monitor (monitor.py; `cweq monitor`). One sample per tick into the `metrics` table; threshold crossings go to
# `monitor_alerts`; the dispatcher's admission uses the latest sample while it is younger than fresh_sec.
[monitor]
tick_sec = 60
window_min = 60               # burn rate: least squares over this many minutes of samples
fresh_sec = 120
images_every_sec = 600       # image count (`docker images -q`), in the background
images_timeout_sec = 300
docker_df_every_sec = 3600    # build-cache size (`docker system df`): many minutes on a large image store
docker_timeout_sec = 1800     # ... stopped after this; samples carry the last result
once_wait_sec = 120           # `monitor --once` waits this long for each Docker probe
retention_days = 7
disk_free_gb_warn = 300
disk_floor_within_h = 6       # forecast: free disk reaches limits.min_free_disk_gb within this many hours
cleanup_on_forecast = true    # ... then queue one extra cleanup job per UTC hour
load_warn = 200
mem_available_gb_warn = 40
tmp_inode_pct_warn = 85
root_inode_pct_warn = 85
inode_full_within_h = 12

# Preflight (preflight.py; `cweq preflight`): file locations it checks. Every key is optional.
# [preflight]
# daemon_json = "/etc/docker/daemon.json"
# limits_env = "~/.tb-graders/cwe/slots/limits.env"
# model_env = ["~/.config/cwe/models.env", "~/.tb-graders/cwe/models.env"]
